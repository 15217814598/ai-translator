<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>译流 · AI 翻译</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <div class="seal" aria-hidden="true">译</div>
    <div class="brand">
      <h1>译流</h1>
      <p>LINGUAFLOW · AI TRANSLATION</p>
    </div>
    <button id="btnOptions" class="gear" title="设置" aria-label="打开设置">⚙</button>
  </header>

  <div id="apiBanner" class="banner hidden">
    还没有配置 API，先<a id="bannerLink" href="#">去设置</a>填好接口与密钥。
  </div>

  <div class="direction">
    <span class="dir-from">自动检测</span>
    <span class="dir-arrow" aria-hidden="true">→</span>
    <select id="targetLang" aria-label="目标语言">
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </div>

  <textarea id="input" rows="4" placeholder="粘贴或输入要翻译的文字&#10;也可以在网页里选中文本，再点开这里"></textarea>

  <button id="btnTranslate" class="primary">翻译</button>

  <section class="result" aria-live="polite">
    <div class="result-head">
      <span class="label">译文</span>
      <button id="btnCopy" class="text-btn hidden">复制</button>
      <span id="resultMeta" class="meta"></span>
    </div>
    <div id="result" class="result-text placeholder">译文会出现在这里</div>
  </section>

  <section class="page-row">
    <button id="btnPage" class="ghost">翻译整页</button>
    <button id="btnRestore" class="ghost hidden">恢复原文</button>
  </section>

  <section class="history">
    <div class="history-head">
      <span class="label">最近</span>
      <button id="btnClearHistory" class="text-btn">清空</button>
    </div>
    <ul id="historyList" class="history-list">
      <li class="history-empty">还没有翻译记录</li>
    </ul>
  </section>

  <script src="popup.js"></script>
</body>
</html>
